<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src blob:; img-src 'self' data: blob:; frame-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Allembra</title>

<script src="vault.js"></script>
</head>
<body>
<div id="allembra-editorial">
  <article class="ae-phone" aria-label="Allembra">
    <header class="ae-bar">
      <button type="button" class="ae-brand" data-page="settings" aria-label="Allembra · Ajustes"><svg class="ae-mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M14,77 L42,17 L51,17 L52,29 L32,69 L43,64 L39,75 L27,79 L23,83 Z"/><path d="M50,17 L57,17 L86,77 L77,83 L68,72 L44,72 L49,62 L64,62 L50,29 Z"/><path d="M45.4,49 a5.6,5.6 0,1 0,11.2,0 a5.6,5.6 0,1 0,-11.2,0 Z"/></svg>Allembra</button>
      <button type="button" data-action="notice" aria-label="Ver notificação de exemplo"><span class="ae-glyph ae-bell" aria-hidden="true"><b></b></span></button>
    </header>
    <div class="ae-stage"><section class="ae-page"></section></div>
    <nav class="ae-nav" aria-label="Navegação principal">
      <span class="ae-nav-drop" aria-hidden="true"></span>
      <button type="button" data-page="week" aria-label="Cápsulas"><i data-lucide="archive" aria-hidden="true"></i></button>
      <button type="button" data-page="home" aria-label="Registrar" aria-current="page"><i data-lucide="feather" aria-hidden="true"></i></button>
      <button type="button" data-page="relic" aria-label="Relicário"><i data-lucide="lock-open" aria-hidden="true"></i></button>
    </nav>
    <dialog class="ae-notice" aria-labelledby="ae-notice-title">
      <div class="ae-notice-content">
        <div class="ae-notice-masthead"><svg class="ae-mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M14,77 L42,17 L51,17 L52,29 L32,69 L43,64 L39,75 L27,79 L23,83 Z"/><path d="M50,17 L57,17 L86,77 L77,83 L68,72 L44,72 L49,62 L64,62 L50,29 Z"/><path d="M45.4,49 a5.6,5.6 0,1 0,11.2,0 a5.6,5.6 0,1 0,-11.2,0 Z"/></svg><strong>Allembra</strong><span class="ae-small">Cápsula disponível</span></div>
        <h2 id="ae-notice-title">Uma manhã<br>sem pressa.</h2>
        <p>Uma lembrança sua está pronta para abrir.</p>
      </div>
      <div class="ae-actions"><button type="button" data-action="dismiss">Depois</button><button type="button" data-action="open" class="ae-primary">Abrir carta</button></div>
    </dialog>
    <dialog class="ae-share-format" aria-label="Formato do print"><h3>Formato do print</h3><div class="ae-actions">
      <button type="button" data-action="print-post">1:2</button><button type="button" data-action="print-story" class="ae-primary">Stories · 9:16</button></div>
      <button type="button" data-action="print-close">Cancelar</button></dialog>
    <dialog class="ae-month" aria-labelledby="ae-month-title"><div class="ae-month-content"></div></dialog>
  </article>
</div>
<style>
@font-face{font-family:Inter;src:url(inter.ttf) format('truetype');font-weight:100 900}
@font-face{font-family:Newsreader;src:url(newsreader.ttf) format('truetype');font-weight:200 800}
#allembra-editorial{padding:10px 4px;font:14px/1.4 Inter,system-ui,sans-serif}
#allembra-editorial [hidden]{display:none!important}
#allembra-editorial .ae-phone{--blue:#005a85;--paper:#fff9e9;--gold:#ffbb23;--pale:#7ee4f0;--ink:#082b3b;--line:#ffffff85;--accent:#ffbb23;color-scheme:light;position:relative;isolation:isolate;overflow:hidden;max-width:405px;margin:auto;min-height:615px;border-radius:24px;background:var(--blue);color:var(--paper);display:flex;flex-direction:column;box-shadow:0 12px 30px #0c273345}
#allembra-editorial .ae-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 4px}
#allembra-editorial .ae-bar strong{display:flex;gap:8px;align-items:center;font:600 22px Newsreader,Georgia,serif}
#allembra-editorial .ae-mark{position:relative;display:inline-block;width:27px;aspect-ratio:1;flex:none}
#allembra-editorial .ae-stage{flex:1;display:grid;perspective:1100px}
#allembra-editorial .ae-page{min-width:0;min-height:514px;display:flex;flex-direction:column;gap:14px;padding:21px 20px 19px;box-sizing:border-box;background:var(--blue);backface-visibility:hidden;transform-origin:center;position:relative}
#allembra-editorial h2,#allembra-editorial h3,#allembra-editorial p{margin:0}
#allembra-editorial h2{font:500 clamp(38px,10vw,60px)/.91 Newsreader,Georgia,serif;letter-spacing:-.046em;overflow-wrap:anywhere}
#allembra-editorial h3{font:500 32px/.95 Newsreader,Georgia,serif}
#allembra-editorial p{font-size:14px;overflow-wrap:anywhere}
#allembra-editorial .ae-small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:650}
#allembra-editorial button,#allembra-editorial input,#allembra-editorial textarea,#allembra-editorial select{font:inherit;box-sizing:border-box}
#allembra-editorial button{min-height:44px;min-width:44px;padding:7px 10px;border-radius:13px;color:inherit;background:transparent;border:1px solid var(--line)}
#allembra-editorial button:focus-visible,#allembra-editorial textarea:focus-visible{outline:2px solid #ce7e1a;outline-offset:3px}
#allembra-editorial button i,#allembra-editorial button svg{width:19px;height:19px;flex:none}
#allembra-editorial .ae-bar button{border:0;display:grid;place-items:center}
#allembra-editorial .ae-primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
#allembra-editorial .ae-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:5px;border-radius:15px;overflow:hidden;background:#075174}
#allembra-editorial .ae-grid button{display:flex;align-items:center;gap:9px;text-align:left;min-height:63px;border-radius:0;border:0;background:var(--paper);color:var(--ink)}
#allembra-editorial .ae-grid button:first-child{grid-column:span 2;background:var(--gold)}
#allembra-editorial .ae-grid button:nth-child(3){background:#73ddee}
#allembra-editorial .ae-grid button:nth-child(4){background:#c9edfa}
#allembra-editorial .ae-grid button:nth-child(5){background:#ffda72}
#allembra-editorial .ae-grid strong{font:600 24px/1 Newsreader,Georgia,serif;overflow-wrap:anywhere}
#allembra-editorial .ae-nav{align-self:center;display:flex;align-items:center;gap:5px;padding:4px;margin:4px 12px 14px;background:var(--paper);color:var(--ink);border-radius:30px;box-shadow:0 4px 13px #032a3950}
#allembra-editorial .ae-nav button{display:flex;align-items:center;justify-content:center;gap:5px;border:0;border-radius:25px;padding:7px 9px;font-size:12px}
#allembra-editorial .ae-nav button:not([aria-current]) span{display:none}
#allembra-editorial .ae-nav button[aria-current]{background:var(--blue);color:var(--paper)}
#allembra-editorial .ae-nav button[data-page=home] i,#allembra-editorial .ae-nav button[data-page=home] svg{transition:transform .25s}
#allembra-editorial .ae-nav button[data-page=home][aria-current] i,#allembra-editorial .ae-nav button[data-page=home][aria-current] svg{transform:rotate(-13deg)}
#allembra-editorial .ae-page.ae-editor{background:var(--paper);color:var(--ink);--line:#16374646;flex:1}
#allembra-editorial .ae-phone[data-full=true] .ae-bar,#allembra-editorial .ae-phone[data-full=true] .ae-nav{display:none}
#allembra-editorial .ae-editor{min-height:615px}
#allembra-editorial .ae-tools,#allembra-editorial .ae-actions{display:flex;align-items:center;justify-content:space-between;gap:6px}
#allembra-editorial .ae-tools button{padding:6px 8px}
#allembra-editorial .ae-tools select{min-width:0;max-width:42%;min-height:44px}
#allembra-editorial .ae-editor textarea{background:transparent;color:var(--ink);border:0;width:100%;flex:1;min-height:310px;padding:4px 0;resize:vertical;font:400 25px/1.24 Newsreader,Georgia,serif}
#allembra-editorial .ae-editor textarea:focus,#allembra-editorial .ae-editor textarea:focus-visible{outline:none;border:none;box-shadow:none}
#allembra-editorial .ae-editor textarea::placeholder{color:#496671}
#allembra-editorial .ae-wavebox{flex:1;min-height:300px;position:relative;display:flex;align-items:center;padding:18px 0;overflow:hidden}
#allembra-editorial .ae-wavebox canvas{position:absolute;inset:0;width:100%;height:100%}
#allembra-editorial .ae-mic{position:relative;z-index:1;display:grid;place-items:center;width:87px;height:87px;border-radius:50%;border:4px solid #1a292d;color:#f8f6e9;background:repeating-linear-gradient(0deg,#4e6065a0 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,#24363d99 0 1px,transparent 1px 3px),linear-gradient(125deg,#a4aca6,#3b4c4e 65%,#536066);box-shadow:inset 0 0 0 5px #213035a0,0 5px 12px #142d3955}
#allembra-editorial .ae-mic i,#allembra-editorial .ae-mic svg{width:29px;height:29px}
#allembra-editorial .ae-mic[aria-pressed=true]{border-color:#0a1215;box-shadow:inset 0 0 0 5px #213035a0,0 0 0 3px #ffbb23}
#allembra-editorial .ae-mic[aria-pressed=true] svg{animation:ae-mic-pop .42s ease both}
@keyframes ae-mic-pop{50%{transform:scale(.68)}}
#allembra-editorial .ae-media{flex:1;min-height:294px;display:grid;place-items:center;background:#dce9e9;border:1px solid #9cb8be}
#allembra-editorial .ae-media i,#allembra-editorial .ae-media svg{width:46px;height:46px}
#allembra-editorial .ae-status:empty{display:none}
#allembra-editorial .ae-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;align-items:start;margin-top:11px}
#allembra-editorial .ae-day{min-width:0;min-height:61px;padding:9px 1px 9px;border:1px solid #a9d8ec;border-radius:25px;display:grid;align-content:start;justify-items:center;gap:6px;text-align:center;font-size:11px}
#allembra-editorial .ae-day time{font:600 19px/1 Newsreader,Georgia,serif}
#allembra-editorial .ae-day[aria-current=date]{background:#f9f4e3;color:var(--ink);border-color:#f9f4e3}
#allembra-editorial .ae-badge{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--ink)}
#allembra-editorial .ae-badge i,#allembra-editorial .ae-badge svg{width:13px;height:13px}
#allembra-editorial .ae-letter{background:var(--paper);color:var(--ink);min-height:235px;padding:20px;border-radius:3px;box-shadow:3px 5px 0 #b5d1da;display:grid;align-content:start;gap:14px}
#allembra-editorial .ae-letter blockquote{font:400 25px/1.19 Newsreader,Georgia,serif;margin:0}
#allembra-editorial .ae-page select,#allembra-editorial .ae-page input{background:var(--paper);color:var(--ink);border:1px solid #74929c;border-radius:9px;padding:8px;min-height:44px}
#allembra-editorial .ae-label{display:grid;gap:5px}
#allembra-editorial .ae-notice{position:absolute;top:70px;margin:0 auto;box-sizing:border-box;width:calc(100% - 30px);max-width:372px;border:0;border-radius:18px;background:var(--paper);color:var(--ink);padding:8px;box-shadow:0 16px 35px #17353b66}
#allembra-editorial .ae-notice::backdrop{background:#06222c83}
#allembra-editorial .ae-notice[open]{animation:ae-enter .27s ease both}
#allembra-editorial .ae-notice-content{background:repeating-linear-gradient(0deg,transparent 0 3px,#302c2508 3px 4px),#eee6d5;color:#25221e;padding:16px;border:1px solid #b7ad9b;border-radius:4px;display:grid;gap:9px}
#allembra-editorial .ae-notice{background:#e6decd;color:#211e1a}
#allembra-editorial .ae-notice h2{font-size:40px;border-top:3px double #544e43;padding-top:10px}
#allembra-editorial .ae-notice .ae-primary{background:#2a2824;color:#faf3e4}
#allembra-editorial .ae-nav button svg{stroke-width:1.45}
#allembra-editorial .ae-editor{padding-bottom:84px}
#allembra-editorial .ae-feather{position:absolute;right:15px;bottom:15px;z-index:3;display:grid;place-items:center;width:55px;height:55px;border-radius:50%;border:0;background:#ffbb23;color:#092b3b;box-shadow:0 4px 10px #002f4638;touch-action:none;transition:left .2s ease,top .2s ease}
#allembra-editorial .ae-feather[data-drag=true]{transition:none}
#allembra-editorial .ae-feather svg{width:24px;height:24px;stroke-width:1.6}
#allembra-editorial .ae-page.ae-camera{background:#0d2028;color:#fff9e9;padding-bottom:84px;--line:#fff9e97a}
#allembra-editorial .ae-camera .ae-tools{position:relative;z-index:1;justify-content:space-between}
#allembra-editorial .ae-camera-view{position:absolute;inset:0;background:#102a36;overflow:hidden}

#allembra-editorial .ae-camera p{position:relative;margin-top:auto;padding:5px 9px;width:max-content;max-width:90%;border-radius:6px;background:#0d2028d9}
#allembra-editorial .ae-vintage{display:block;position:relative;width:34px;height:22px;border:2px solid currentColor;border-radius:3px;opacity:.47;color:#fff9e9;margin:9px 4px}
#allembra-editorial .ae-vintage-photo:before{content:"";position:absolute;border:2px solid currentColor;border-radius:50%;width:11px;height:11px;left:9px;top:3px}
#allembra-editorial .ae-vintage-photo:after{content:"";position:absolute;border:2px solid currentColor;border-bottom:0;width:10px;height:4px;top:-7px;left:4px}
#allembra-editorial .ae-vintage-video{width:26px;height:16px;margin-right:12px}
#allembra-editorial .ae-vintage-video:before{content:"○○";position:absolute;top:-18px;left:0;font:700 15px/1 Georgia,serif;letter-spacing:-1px}
#allembra-editorial .ae-vintage-video:after{content:"";position:absolute;right:-9px;top:2px;width:6px;height:9px;border:2px solid currentColor;transform:skewY(-20deg)}

#allembra-editorial .ae-notice .ae-actions{padding-top:6px}
#allembra-editorial .ae-notice .ae-actions button{flex:1;border-color:#21627b40}
@keyframes ae-enter{from{opacity:0;transform:translateY(9px) scale(.97)}to{opacity:1;transform:none}}
#allembra-editorial .ae-caption a{color:inherit}
#allembra-editorial .ae-caption{margin-top:auto;font-size:12px}
@media(prefers-reduced-motion:reduce){#allembra-editorial *{animation-duration:0s!important;transition-duration:0s!important}}
@media(max-width:345px){#allembra-editorial .ae-page{padding-left:13px;padding-right:13px}#allembra-editorial .ae-week{gap:3px}#allembra-editorial .ae-day{font-size:10px}}
#allembra-editorial .ae-phone{background:var(--scene,#005a85);transition:background-color .25s}

#allembra-editorial .ae-media-icon{display:grid;place-items:center}

  function wrapCardText(context,text,width,maxLines){
    if(maxLines<1)return [];
    const lines=[];
    for(const paragraph of text.split('\n')){
      let line='';

        const candidate=line?line+' '+word:word;
        if(line&&context.measureText(candidate).width>width){lines.push(line);line='';}
        for(const character of (line?' ':'')+word){
          if(line&&context.measureText(line+character).width>width){lines.push(line);line='';}
          line+=character;
        }
        if(lines.length>maxLines)break;
      }
      lines.push(line);
      if(lines.length>maxLines)break;
    }
    if(lines.length>maxLines){
      lines.length=maxLines;
      let last=lines[maxLines-1];
      while(last&&context.measureText(last+'…').width>width)last=last.slice(0,-1);
      lines[maxLines-1]=last+'…';
    }
    return lines;
  }

    if(Math.abs(x)<45||Math.abs(x)<Math.abs(y)*1.4)return;
    const tabs=['week','home','relic'];
    const target=tabs[tabs.indexOf(state.page)+(x<0?1:-1)];
    if(target)go(target);
  });
  root.addEventListener('pointercancel',()=>{screenSwipe=undefined;});
  page.addEventListener('dblclick',event=>{
    if(state.page==='week'&&!event.target.closest('button,select,input,.ae-day-detail')){
      state.weekOffset=0;state.day=null;render();
    }
  });
  let weekGesture, skipDayClick=false;
  root.addEventListener('pointerdown',event=>{
    const column=event.target.closest('.ae-week');
    if(!column||!event.isPrimary)return;
    skipDayClick=false;
    const key=event.target.closest('[data-day]')?.dataset.day;
    weekGesture={id:event.pointerId,x:event.clientX,y:event.clientY,key};
    if(key)weekGesture.timer=setTimeout(()=>{
      skipDayClick=true;showMonth(key);weekGesture=undefined;
    },520);
    (event.target.closest('[data-day]')||column).setPointerCapture?.(event.pointerId);
  });
  root.addEventListener('pointermove',event=>{
    if(weekGesture?.id===event.pointerId&&Math.hypot(event.clientX-weekGesture.x,event.clientY-weekGesture.y)>9)
      clearTimeout(weekGesture.timer);
  });
  for(const type of ['pointerup','pointercancel'])root.addEventListener(type,event=>{
    if(weekGesture?.id!==event.pointerId)return;
    const deltaX=event.clientX-weekGesture.x,deltaY=event.clientY-weekGesture.y;
    clearTimeout(weekGesture.timer);weekGesture=undefined;
    if(type==='pointerup'&&Math.abs(deltaX)>35&&Math.abs(deltaX)>Math.abs(deltaY)){
      skipDayClick=true;shiftWeek(deltaX>0?-1:1);
    }
  });
  for(const dialog of [notice,calendar]){
    dialog.addEventListener('click',event=>{
      if(event.target!==dialog)return;
      const b=dialog.getBoundingClientRect();
      if(event.clientX<b.left||event.clientX>b.right||event.clientY<b.top||event.clientY>b.bottom)dialog.close();
    });
  }
  window.allembraBack=()=>{
    const leave=q('.ae-leave-record[open]');if(leave){leave.close();return true;}
    if(shareFormat.open){shareFormat.close();return true;}
    const review=q('.ae-save-menu[open]');if(review){review.close();return true;}
    if(calendar.open){calendar.close();return true;}
    if(notice.open){notice.close();return true;}
    const gate=q('.ae-vault[open]');
    if(gate)return false;
    if(state.page==='home')return false;
    go(state.page==='letter'?(state.opened?'relic':'week'):'home');
    return true;
  };
  window.addEventListener('allembra:pause',()=>{
    if(audioActive)stopAudio();
    if(state.page==='capture' && cameraType(state.kind) && cameraStream){
      stopCamera();
      q('.ae-status').textContent='Câmera pausada. Volte e abra este registro novamente.';
    }
  });
  window.addEventListener('pagehide',()=>{stopAudio(true);stopCamera();});
  render();
  if(globalThis.AllembraStore)AllembraStore.start(state,{render,present:presentStatus});
  async function persist(){
    try {
      if(globalThis.AllembraStore)await AllembraStore.save(state);
      return true;
    } catch (error){
      const node=q('.ae-status');if(node)node.textContent=error.message||'Não foi possível salvar.';
      return false;
    }
  }
})();
</script>

</body>
</html>
