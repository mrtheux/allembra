name: APK de teste Android
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK 35
        run: |
          sdk="$RUNNER_TEMP/android-sdk-35"
          mkdir -p "$sdk"
          cd "$sdk"
          curl --fail --silent --show-error --location --retry 3 https://dl.google.com/android/repository/platform-35_r02.zip -o platform.zip
          curl --fail --silent --show-error --location --retry 3 https://dl.google.com/android/repository/build-tools_r35_linux.zip -o build-tools.zip
          echo '0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0  platform.zip' | sha256sum --check
          echo 'bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88  build-tools.zip' | sha256sum --check
          unzip -q platform.zip -d platform
          unzip -q build-tools.zip -d build-tools
          echo "DAQUI_PLATFORM=$sdk/platform/android-35/android.jar" >> "$GITHUB_ENV"
          echo "DAQUI_BUILD_TOOLS=$sdk/build-tools/android-15" >> "$GITHUB_ENV"
      - name: Compilar e verificar assinatura
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_BUCKET_ID: ${{ vars.APPWRITE_BUCKET_ID }}
          APPWRITE_RECOVERY_URL: ${{ vars.APPWRITE_RECOVERY_URL }}
          APPWRITE_VERIFICATION_URL: ${{ vars.APPWRITE_VERIFICATION_URL }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-preview ]]; then
            curl --fail --silent --show-error --location --retry 3 https://dl.google.com/android/repository/platform-36_r02.zip -o "$RUNNER_TEMP/platform-36.zip"
            echo "37607369a28c5b640b3a7998868d45898ebcb777565a0e85f9acf36f29631d2e  $RUNNER_TEMP/platform-36.zip" | sha256sum --check
            unzip -q "$RUNNER_TEMP/platform-36.zip" -d "$RUNNER_TEMP/platform-36"
            DAQUI_PLATFORM="$RUNNER_TEMP/platform-36/android-36/android.jar" ./build-apk.sh --design-preview
            exit 0
          fi
          {
            printf 'endpoint=%s\n' "$APPWRITE_ENDPOINT"
            printf 'projectId=%s\n' "$APPWRITE_PROJECT_ID"
            printf 'bucketId=%s\n' "$APPWRITE_BUCKET_ID"
            printf 'recoveryUrl=%s\n' "$APPWRITE_RECOVERY_URL"
            printf 'verificationUrl=%s\n' "$APPWRITE_VERIFICATION_URL"
          } > app/src/main/assets/appwrite.properties
          ./build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Allembra-teste
          path: ${{ endsWith(github.ref_name, '-preview') && 'build/design-preview/Allembra-teste.apk' || 'build/preview/Allembra-teste.apk' }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Allembra-teste
      - name: Anexar APK à prévia no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-preview ]]; then
            gh release create "$TAG" Allembra-teste.apk --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "Allembra · Prévia de design" --notes "APK de teste para Android 9 ou superior, instalado ao lado das versões anteriores. Ícone Vermelho laca. Registros em cofre local criptografado. Teste câmera, microfone, selagem e recuperação antes de usar com memórias importantes."
            exit 0
          fi
          gh release create "$TAG" Allembra-teste.apk --repo "$GITHUB_REPOSITORY"             --verify-tag --prerelease --title "Allembra $TAG · Teste Android"             --notes "Prévia para Android 9 ou superior. Baixe Allembra-teste.apk em Assets. O login e o backup dependem da configuração do Appwrite."
